<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出貨與運費紀錄系統</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 24px; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; color: var(--primary); }
        .section { background: #f1f5f9; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .section-title { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
        
        .input-group { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        input[type="date"], input[type="number"] { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .item-card { background: white; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .item-name { font-weight: 600; font-size: 0.95rem; }
        .number-input-custom { width: 100%; text-align: center; font-size: 1.1rem; font-weight: 700; }

        .shipping-row { display: flex; flex-direction: column; gap: 12px; }
        .shipping-item { background: white; padding: 14px; border-radius: 10px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .shipping-info { display: flex; flex-direction: column; gap: 4px; }
        .qty-input-sm { width: 80px; text-align: center; }

        .summary-card { background: #e0e7ff; border-radius: 12px; padding: 16px; margin-top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .summary-total { border-top: 2px dashed #c7d2fe; padding-top: 8px; margin-top: 8px; font-size: 1.25rem; font-weight: 800; color: #3730a3; }

        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit { background: var(--primary); color: white; }
        .btn-reset { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 出貨與運費紀錄系統</h2>

    <!-- 出貨日期 -->
    <div class="section">
        <div class="input-group">
            <label for="order-date">🗓 出貨日期：</label>
            <input type="date" id="order-date" onchange="calculateTotal()">
        </div>
    </div>

    <!-- 第一行：包材數量 -->
    <div class="section">
        <div class="section-title">📦 包材數量</div>
        <div class="grid-3">
            <div class="item-card">
                <div class="item-name">箱子</div>
                <input type="number" id="qty-box" class="number-input-custom" value="0" min="0" oninput="calculateTotal()">
            </div>
            <div class="item-card">
                <div class="item-name">袋子</div>
                <input type="number" id="qty-bag" class="number-input-custom" value="0" min="0" oninput="calculateTotal()">
            </div>
            <div class="item-card">
                <div class="item-name">郵局包材</div>
                <input type="number" id="qty-post-pkg" class="number-input-custom" value="0" min="0" oninput="calculateTotal()">
            </div>
        </div>
    </div>

    <!-- 第二行：運費計算 -->
    <div class="section">
        <div class="section-title">🚚 運費計算</div>
        <div class="shipping-row">
            <div class="shipping-item">
                <div class="shipping-info">
                    <span class="item-name">🏪 7-11 數量</span>
                </div>
                <div>
                    <input type="number" id="qty-ship-711" class="qty-input-sm" value="0" min="0" oninput="calculateTotal()">
                </div>
            </div>

            <div class="shipping-item">
                <div class="shipping-info">
                    <span class="item-name">📮 郵局數量與運費</span>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    數量: <input type="number" id="qty-ship-post" class="qty-input-sm" value="0" min="0" oninput="calculateTotal()">
                    單價: <input type="number" id="price-ship-post" class="qty-input-sm" value="0" min="0" oninput="calculateTotal()">
                </div>
            </div>
        </div>
    </div>

    <!-- 結算摘要 -->
    <div class="summary-card">
        <div class="summary-row">
            <span>📅 選取日期：</span>
            <span id="summary-date">-</span>
        </div>
        <div class="summary-row summary-total">
            <span>💰 總運費估算：</span>
            <span id="summary-grand-total">$0</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-reset" onclick="resetAll()">🔄 清空歸零</button>
        <button class="btn btn-submit" onclick="sendToGoogleSheet()">📤 送出至 Google 試算表</button>
    </div>
</div>

<script>
    // 您的 Google Apps Script Web App 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzfL27t8S_cv_urn_gcTc0esDKqR2E5ptLVrHvdPFWSkdpBk5Mk4HHspWToI1vz5fcU/exec";

    window.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('order-date');
        dateInput.value = new Date().toISOString().split('T')[0];
        calculateTotal();
    });

    function calculateTotal() {
        const dateVal = document.getElementById('order-date').value;
        const ship711Qty = parseInt(document.getElementById('qty-ship-711').value) || 0;
        const shipPostPrice = parseFloat(document.getElementById('price-ship-post').value) || 0;
        const shipPostQty = parseInt(document.getElementById('qty-ship-post').value) || 0;

        const grandTotal = (ship711Qty * 60) + (shipPostQty * shipPostPrice);

        document.getElementById('summary-date').innerText = dateVal || '未選擇';
        document.getElementById('summary-grand-total').innerText = `$${grandTotal}`;
    }

    function resetAll() {
        document.getElementById('qty-box').value = 0;
        document.getElementById('qty-bag').value = 0;
        document.getElementById('qty-post-pkg').value = 0;
        document.getElementById('qty-ship-711').value = 0;
        document.getElementById('price-ship-post').value = 0;
        document.getElementById('qty-ship-post').value = 0;
        document.getElementById('order-date').value = new Date().toISOString().split('T')[0];
        calculateTotal();
    }

    function sendToGoogleSheet() {
        // 使用 FormData 包裝要發送的資料
        const formData = new FormData();
        formData.append('date', document.getElementById('order-date').value);
        formData.append('box', document.getElementById('qty-box').value || 0);
        formData.append('bag', document.getElementById('qty-bag').value || 0);
        formData.append('post_pkg', document.getElementById('qty-post-pkg').value || 0);
        formData.append('ship_711_qty', document.getElementById('qty-ship-711').value || 0);
        formData.append('ship_post_qty', document.getElementById('qty-ship-post').value || 0);
        formData.append('ship_post_price', document.getElementById('price-ship-post').value || 0);

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors'
        }).then(() => {
            alert('數據已成功發送至 Google 試算表！');
        }).catch(err => alert('發送失敗：' + err));
    }
</script>

</body>
</html>
