<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>耗材與寄件紀錄器</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="date"], input[type="url"], input[type="number"] {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
        }

        /* 耗材獨立計數區塊 */
        .item-counter-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: #fff;
            transition: all 0.15s ease;
        }

        .item-counter-card.active {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .item-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-mini-qty {
            width: 36px;
            height: 36px;
            border: none;
            background-color: #e5e7eb;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-mini-qty {
            width: 50px;
            height: 36px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            background: #fff;
        }

        /* 其他標籤網格 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cat-btn {
            height: 44px;
            border: 2px solid var(--border-color);
            background-color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cat-btn.active {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        /* 郵局運費自訂金額輸入區域 */
        .post-price-box {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: #eff6ff;
            border-radius: 8px;
            border: 1px solid var(--primary);
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-list {
            list-style: none;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .tag-chip {
            background-color: #eff6ff;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .record-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-delete {
            background-color: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.9rem;
            padding: 6px 10px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 耗材與寄件紀錄器</h1>
    </header>

    <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="sheet-url">Google Sheets Web App 網址（自動記憶）</label>
            <input type="url" id="sheet-url" placeholder="貼上 Web App 網址 (https://script.google.com/...)">
        </div>
    </div>

    <div class="card">
        <div class="form-group">
            <label for="record-date">日期</label>
            <input type="date" id="record-date">
        </div>

        <!-- 獨立數量選取區 -->
        <div class="form-group">
            <label>耗材選擇與數量</label>
            
            <div class="item-counter-card" id="card-箱子">
                <span class="item-label">📦 箱子</span>
                <div class="counter-controls">
                    <button type="button" class="btn-mini-qty" onclick="adjustQty('箱子', -1)">-</button>
                    <input type="number" id="qty-箱子" class="input-mini-qty" value="0" min="0" onchange="updateCardStatus('箱子')">
                    <button type="button" class="btn-mini-qty" onclick="adjustQty('箱子', 1)">+</button>
                </div>
            </div>

            <div class="item-counter-card" id="card-袋子">
                <span class="item-label">🛍️ 袋子</span>
                <div class="counter-controls">
                    <button type="button" class="btn-mini-qty" onclick="adjustQty('袋子', -1)">-</button>
                    <input type="number" id="qty-袋子" class="input-mini-qty" value="0" min="0" onchange="updateCardStatus('袋子')">
                    <button type="button" class="btn-mini-qty" onclick="adjustQty('袋子', 1)">+</button>
                </div>
            </div>
        </div>

        <!-- 其他類別切換 -->
        <div class="form-group">
            <label>其他項目（可多選）</label>
            <div class="category-grid">
                <button type="button" class="cat-btn" data-cat="郵局">郵局</button>
                <button type="button" class="cat-btn" data-cat="711運費">711運費</button>
                <button type="button" class="cat-btn" id="btn-post-fee">郵局運費</button>
            </div>

            <!-- 郵局運費金額輸入區域 -->
            <div class="post-price-box" id="post-price-box">
                <label for="post-fee-amount" style="margin-bottom: 4px; color: var(--primary);">請輸入郵局運費金額 ($NT)：</label>
                <input type="number" id="post-fee-amount" placeholder="例如：80" min="0">
            </div>
        </div>

        <button type="button" class="btn-submit" id="btn-add">新增並寫入試算表</button>
    </div>

    <div class="card">
        <div class="list-header">
            <label style="margin: 0;">歷史紀錄</label>
        </div>
        <ul class="record-list" id="record-list"></ul>
    </div>

    <script>
        const dateInput = document.getElementById('record-date');
        const sheetUrlInput = document.getElementById('sheet-url');
        const catButtons = document.querySelectorAll('.cat-btn:not(#btn-post-fee)');
        const btnAdd = document.getElementById('btn-add');
        const recordList = document.getElementById('record-list');
        const postFeeBtn = document.getElementById('btn-post-fee');
        const postPriceBox = document.getElementById('post-price-box');
        const postFeeAmountInput = document.getElementById('post-fee-amount');

        let selectedCategories = [];
        let isPostFeeSelected = false;
        let records = JSON.parse(localStorage.getItem('shipment_records')) || [];

        // 初始化日期與自動讀取記憶網址
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        dateInput.value = getTodayString();
        sheetUrlInput.value = localStorage.getItem('google_sheet_url') || '';

        // 輸入即時記憶網址
        sheetUrlInput.addEventListener('input', () => {
            localStorage.setItem('google_sheet_url', sheetUrlInput.value.trim());
        });

        // 獨立耗材數量微調邏輯
        function adjustQty(item, delta) {
            const input = document.getElementById(`qty-${item}`);
            let val = parseInt(input.value) || 0;
            val = Math.max(0, val + delta);
            input.value = val;
            updateCardStatus(item);
        }

        // 更新耗材外觀卡片選取狀態
        function updateCardStatus(item) {
            const input = document.getElementById(`qty-${item}`);
            const card = document.getElementById(`card-${item}`);
            const val = parseInt(input.value) || 0;
            
            if (val > 0) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }
        }

        // 一般標籤切換
        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const cat = btn.dataset.cat;
                if (selectedCategories.includes(cat)) {
                    selectedCategories = selectedCategories.filter(c => c !== cat);
                    btn.classList.remove('active');
                } else {
                    selectedCategories.push(cat);
                    btn.classList.add('active');
                }
            });
        });

        // 郵局運費按鈕獨立點擊邏輯
        postFeeBtn.addEventListener('click', () => {
            isPostFeeSelected = !isPostFeeSelected;
            if (isPostFeeSelected) {
                postFeeBtn.classList.add('active');
                postPriceBox.style.display = 'block';
                postFeeAmountInput.focus();
            } else {
                postFeeBtn.classList.remove('active');
                postPriceBox.style.display = 'none';
                postFeeAmountInput.value = '';
            }
        });

        // 新增並送出紀錄
        btnAdd.addEventListener('click', async () => {
            const date = dateInput.value;
            if (!date) return alert('請選擇日期');

            const items = [];

            // 讀取箱子與袋子的數量
            ['箱子', '袋子'].forEach(item => {
                const qty = parseInt(document.getElementById(`qty-${item}`).value) || 0;
                if (qty > 0) {
                    items.push({ category: item, quantity: qty });
                }
            });

            // 讀取其他選取的標籤
            selectedCategories.forEach(cat => {
                items.push({ category: cat, quantity: 1 });
            });

            // 讀取郵局運費與金額
            if (isPostFeeSelected) {
                const price = postFeeAmountInput.value.trim();
                const categoryName = price ? `郵局運費 $${price}` : '郵局運費';
                items.push({ category: categoryName, quantity: 1 });
            }

            if (items.length === 0) {
                return alert('請至少設定一個耗材數量或選擇一個項目！');
            }

            const newRecord = {
                id: Date.now(),
                date: date,
                items: items
            };

            const sheetUrl = sheetUrlInput.value.trim();
            if (sheetUrl) {
                btnAdd.disabled = true;
                btnAdd.innerText = '同步中...';
                try {
                    await fetch(sheetUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ date: date, items: items })
                    });
                    alert('紀錄已成功新增並寫入試算表！');
                } catch (e) {
                    console.error('同步失敗:', e);
                    alert('寫入試算表失敗，請檢查網址或網路連線。');
                }
                btnAdd.disabled = false;
                btnAdd.innerText = '新增並寫入試算表';
            }

            records.unshift(newRecord);
            saveAndRender();

            // 重設輸入框狀態
            ['箱子', '袋子'].forEach(item => {
                document.getElementById(`qty-${item}`).value = 0;
                updateCardStatus(item);
            });
            selectedCategories = [];
            catButtons.forEach(b => b.classList.remove('active'));
            isPostFeeSelected = false;
            postFeeBtn.classList.remove('active');
            postPriceBox.style.display = 'none';
            postFeeAmountInput.value = '';
        });

        function deleteRecord(id) {
            records = records.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('shipment_records', JSON.stringify(records));
            renderList();
        }

        function renderList() {
            recordList.innerHTML = '';
            if (records.length === 0) {
                recordList.innerHTML = '<div class="empty-state">目前尚無紀錄</div>';
                return;
            }

            records.forEach(item => {
                const li = document.createElement('li');
                li.className = 'record-item';
                
                const tagsHtml = item.items.map(i => {
                    const qtyDisplay = i.quantity > 1 ? ` x${i.quantity}` : '';
                    return `<span class="tag-chip">${i.category}${qtyDisplay}</span>`;
                }).join('');

                li.innerHTML = `
                    <div>
                        <div>${tagsHtml}</div>
                        <div class="record-date">${item.date}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteRecord(${item.id})">刪除</button>
                `;
                recordList.appendChild(li);
            });
        }

        renderList();
    </script>
</body>
</html>
