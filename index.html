<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出貨與運費管理系統</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); padding: 28px; }
        
        h2 { font-size: 1.6rem; text-align: center; color: var(--primary); font-weight: 800; margin-bottom: 24px; letter-spacing: -0.5px; }

        .section { background: #f8fafc; border-radius: 14px; padding: 18px; margin-bottom: 20px; border: 1px solid var(--border); }
        .section-title { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        .input-group { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        input[type="date"], input[type="number"], input[type="text"] { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); }

        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .item-card { background: white; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
        .item-name { font-weight: 600; font-size: 0.9rem; color: #475569; }
        .number-input-custom { width: 100%; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--primary); }

        .shipping-row { display: flex; flex-direction: column; gap: 10px; }
        .shipping-item { background: white; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .qty-input-sm { width: 80px; text-align: center; }

        /* 按鈕樣式 */
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-add { background: #e0e7ff; color: var(--primary); width: 100%; font-size: 1rem; padding: 14px; margin-top: 5px; }
        .btn-add:hover { background: #c7d2fe; }
        .btn-submit { background: var(--success); color: white; flex: 2; }
        .btn-submit:hover { background: #059669; }
        .btn-clear { background: #f3f4f6; color: var(--text-muted); flex: 1; }
        .btn-clear:hover { background: #e5e7eb; }
        .btn-danger-sm { background: #fee2e2; color: var(--danger); padding: 6px 10px; font-size: 0.85rem; border-radius: 6px; }
        .btn-danger-sm:hover { background: #fca5a5; }

        /* 待傳送表格樣式 */
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        th { background: #f1f5f9; color: var(--text-muted); font-weight: 700; white-space: nowrap; }
        td input { width: 65px; text-align: center; padding: 4px 6px; font-size: 0.85rem; }

        .empty-tip { text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.9rem; }
        .action-bar { display: flex; gap: 12px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 出貨與運費管理系統</h2>

    <!-- 1. 出貨日期 -->
    <div class="section">
        <div class="input-group">
            <label for="order-date" style="font-weight: 600;">🗓 出貨日期：</label>
            <input type="date" id="order-date">
        </div>
    </div>

    <!-- 2. 包材數量 -->
    <div class="section">
        <div class="section-title">📦 包材數量</div>
        <div class="grid-3">
            <div class="item-card">
                <span class="item-name">箱子</span>
                <input type="number" id="qty-box" class="number-input-custom" value="0" min="0">
            </div>
            <div class="item-card">
                <span class="item-name">袋子</span>
                <input type="number" id="qty-bag" class="number-input-custom" value="0" min="0">
            </div>
            <div class="item-card">
                <span class="item-name">郵局包材</span>
                <input type="number" id="qty-post-pkg" class="number-input-custom" value="0" min="0">
            </div>
        </div>
    </div>

    <!-- 3. 運費計算 -->
    <div class="section">
        <div class="section-title">🚚 運費資料</div>
        <div class="shipping-row">
            <div class="shipping-item">
                <span class="item-name">🏪 7-11 數量</span>
                <input type="number" id="qty-ship-711" class="qty-input-sm" value="0" min="0">
            </div>
            <div class="shipping-item">
                <span class="item-name">📮 郵局寄送</span>
                <div style="display: flex; gap: 8px; align-items: center;">
                    數量: <input type="number" id="qty-ship-post" class="qty-input-sm" value="0" min="0">
                    單價: <input type="number" id="price-ship-post" class="qty-input-sm" value="0" min="0">
                </div>
            </div>
        </div>
    </div>

    <!-- 加入待傳送清單按鈕 -->
    <button class="btn btn-add" onclick="addToQueue()">➕ 加入待傳送預覽清單</button>

    <!-- 4. 可編輯的待傳送清單 -->
    <div class="section" style="margin-top: 24px; background: white;">
        <div class="section-title" style="justify-content: space-between;">
            <span>📋 待傳送清單 (匯入前可直接點擊修改)</span>
            <span id="queue-count" style="color: var(--primary);">共 0 筆</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>箱子</th>
                        <th>袋子</th>
                        <th>郵局包材</th>
                        <th>711數量</th>
                        <th>郵局數量</th>
                        <th>郵局單價</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="queue-tbody">
                    <!-- 動態渲染清單內容 -->
                </tbody>
            </table>
            <div id="empty-tip" class="empty-tip">目前沒有待傳送的資料，請上方填寫後點擊「新增」。</div>
        </div>
    </div>

    <!-- 5. 底部批次匯入按鈕 -->
    <div class="action-bar">
        <button class="btn btn-clear" onclick="clearQueue()">🗑 清空預覽清單</button>
        <button class="btn btn-submit" onclick="submitBatchToGoogleSheet()">🚀 一鍵匯入至 Google 試算表</button>
    </div>
</div>

<script>
    // ⚠️ 請確保這是您的 GAS Web App 部署網址（必須是 /exec 結尾）
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzfL27t8S_cv_urn_gcTc0esDKqR2E5ptLVrHvdPFWSkdpBk5Mk4HHspWToI1vz5fcU/exec";

    // 本地暫存佇列資料
    let queueData = [];

    // 初始化預設日期
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('order-date').value = new Date().toISOString().split('T')[0];
    });

    // 新增資料到待傳送清單
    function addToQueue() {
        const item = {
            id: Date.now(),
            date: document.getElementById('order-date').value,
            box: parseInt(document.getElementById('qty-box').value) || 0,
            bag: parseInt(document.getElementById('qty-bag').value) || 0,
            post_pkg: parseInt(document.getElementById('qty-post-pkg').value) || 0,
            ship_711_qty: parseInt(document.getElementById('qty-ship-711').value) || 0,
            ship_post_qty: parseInt(document.getElementById('qty-ship-post').value) || 0,
            ship_post_price: parseFloat(document.getElementById('price-ship-post').value) || 0
        };

        queueData.push(item);
        renderQueue();
        resetInputs();
    }

    // 重置輸入欄位
    function resetInputs() {
        document.getElementById('qty-box').value = 0;
        document.getElementById('qty-bag').value = 0;
        document.getElementById('qty-post-pkg').value = 0;
        document.getElementById('qty-ship-711').value = 0;
        document.getElementById('qty-ship-post').value = 0;
        document.getElementById('price-ship-post').value = 0;
    }

    // 渲染表格內容（可在表格內直接編輯）
    function renderQueue() {
        const tbody = document.getElementById('queue-tbody');
        const emptyTip = document.getElementById('empty-tip');
        const queueCount = document.getElementById('queue-count');

        tbody.innerHTML = '';
        queueCount.innerText = `共 ${queueData.length} 筆`;

        if (queueData.length === 0) {
            emptyTip.style.display = 'block';
            return;
        }

        emptyTip.style.display = 'none';

        queueData.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="date" value="${item.date}" onchange="updateQueueItem(${index}, 'date', this.value)" style="width: 110px;"></td>
                <td><input type="number" value="${item.box}" min="0" onchange="updateQueueItem(${index}, 'box', this.value)"></td>
                <td><input type="number" value="${item.bag}" min="0" onchange="updateQueueItem(${index}, 'bag', this.value)"></td>
                <td><input type="number" value="${item.post_pkg}" min="0" onchange="updateQueueItem(${index}, 'post_pkg', this.value)"></td>
                <td><input type="number" value="${item.ship_711_qty}" min="0" onchange="updateQueueItem(${index}, 'ship_711_qty', this.value)"></td>
                <td><input type="number" value="${item.ship_post_qty}" min="0" onchange="updateQueueItem(${index}, 'ship_post_qty', this.value)"></td>
                <td><input type="number" value="${item.ship_post_price}" min="0" onchange="updateQueueItem(${index}, 'ship_post_price', this.value)"></td>
                <td><button class="btn btn-danger-sm" onclick="removeQueueItem(${index})">刪除</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 直接在表格編輯更新數據
    function updateQueueItem(index, key, value) {
        if (key === 'date') {
            queueData[index][key] = value;
        } else {
            queueData[index][key] = parseFloat(value) || 0;
        }
    }

    // 刪除單筆資料
    function removeQueueItem(index) {
        queueData.splice(index, 1);
        renderQueue();
    }

    // 清空待傳送清單
    function clearQueue() {
        if (queueData.length === 0) return;
        if (confirm('確定要清空預覽清單嗎？')) {
            queueData = [];
            renderQueue();
        }
    }

    // 批次匯入 Google 試算表
    async function submitBatchToGoogleSheet() {
        if (queueData.length === 0) {
            alert('目前清單內沒有資料可匯入！');
            return;
        }

        const btnSubmit = document.querySelector('.btn-submit');
        btnSubmit.disabled = true;
        btnSubmit.innerText = '⏳ 正在寫入試算表...';

        try {
            // 逐筆送出資料，確保穩定寫入
            for (const item of queueData) {
                const formData = new FormData();
                formData.append('date', item.date);
                formData.append('box', item.box);
                formData.append('bag', item.bag);
                formData.append('post_pkg', item.post_pkg);
                formData.append('ship_711_qty', item.ship_711_qty);
                formData.append('ship_post_qty', item.ship_post_qty);
                formData.append('ship_post_price', item.ship_post_price);

                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });
            }

            alert(`✅ 成功匯入 ${queueData.length} 筆資料至 Google 試算表！`);
            queueData = [];
            renderQueue();
        } catch (err) {
            alert('❌ 傳送過程發生錯誤：' + err);
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = '🚀 一鍵匯入至 Google 試算表';
        }
    }
</script>

</body>
</html>
