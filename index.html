<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>耗材與寄件紀錄器</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="date"], input[type="url"] {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
        }

        /* 多選項目按鈕區 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cat-btn {
            height: 48px;
            border: 2px solid var(--border-color);
            background-color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cat-btn.active {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        /* 數量調整器 */
        .counter-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 48px;
        }

        .btn-qty {
            width: 56px;
            height: 48px;
            border: none;
            background-color: #e5e7eb;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn-qty:active {
            background-color: #d1d5db;
        }

        .input-qty {
            width: 80px;
            height: 48px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        /* 主要按鈕 */
        .btn-submit {
            width: 100%;
            height: 52px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:active {
            background-color: var(--primary-hover);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-export {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* 歷史紀錄清單 */
        .record-list {
            list-style: none;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .record-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag-chip {
            background-color: #eff6ff;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .record-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .record-qty {
            font-weight: bold;
            font-size: 1.1rem;
            margin-right: 12px;
            color: var(--primary);
        }

        .btn-delete {
            background-color: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.9rem;
            padding: 6px 10px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.9rem;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 2px;
            display: inline-block;
        }
        .status-success { background-color: #d1fae5; color: #065f46; }
        .status-fail { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <header>
        <h1>📦 耗材與寄件紀錄器</h1>
    </header>

    <!-- Google Sheets 設定區塊 -->
    <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="sheet-url">Google Sheets Web App 網址（自動同步）</label>
            <input type="url" id="sheet-url" placeholder="貼上 Apps Script 部署網址 (https://script.google.com/...)">
        </div>
    </div>

    <!-- 輸入區塊 -->
    <div class="card">
        <div class="form-group">
            <label for="record-date">日期</label>
            <input type="date" id="record-date">
        </div>

        <div class="form-group">
            <label>項目（可多選）</label>
            <div class="category-grid">
                <button type="button" class="cat-btn" data-cat="箱子">箱子</button>
                <button type="button" class="cat-btn" data-cat="袋子">袋子</button>
                <button type="button" class="cat-btn" data-cat="寄出">寄出</button>
                <button type="button" class="cat-btn" data-cat="運費">運費</button>
                <button type="button" class="cat-btn" data-cat="郵寄">郵寄</button>
            </div>
        </div>

        <div class="form-group">
            <label for="record-qty">數量</label>
            <div class="counter-container">
                <button type="button" class="btn-qty" id="btn-minus">-</button>
                <input type="number" id="record-qty" class="input-qty" value="1" min="1">
                <button type="button" class="btn-qty" id="btn-plus">+</button>
            </div>
        </div>

        <button type="button" class="btn-submit" id="btn-add">新增並同步紀錄</button>
    </div>

    <!-- 紀錄顯示區塊 -->
    <div class="card">
        <div class="list-header">
            <label style="margin: 0;">歷史紀錄</label>
            <button type="button" class="btn-export" id="btn-export">匯出 CSV</button>
        </div>
        <ul class="record-list" id="record-list">
            <!-- 動態渲染區域 -->
        </ul>
    </div>

    <script>
        const dateInput = document.getElementById('record-date');
        const sheetUrlInput = document.getElementById('sheet-url');
        const catButtons = document.querySelectorAll('.cat-btn');
        const qtyInput = document.getElementById('record-qty');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const btnAdd = document.getElementById('btn-add');
        const btnExport = document.getElementById('btn-export');
        const recordList = document.getElementById('record-list');

        let selectedCategories = [];
        let records = JSON.parse(localStorage.getItem('shipment_records')) || [];

        // 初始化日期與 Google Sheet 網址
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        dateInput.value = getTodayString();
        sheetUrlInput.value = localStorage.getItem('google_sheet_url') || '';

        // 儲存 Google Sheet 網址
        sheetUrlInput.addEventListener('change', () => {
            localStorage.setItem('google_sheet_url', sheetUrlInput.value.trim());
        });

        // 項目多選按鈕邏輯
        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const cat = btn.dataset.cat;
                if (selectedCategories.includes(cat)) {
                    selectedCategories = selectedCategories.filter(c => c !== cat);
                    btn.classList.remove('active');
                } else {
                    selectedCategories.push(cat);
                    btn.classList.add('active');
                }
            });
        });

        // 數量加減
        btnMinus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            if (val > 1) qtyInput.value = val - 1;
        });

        btnPlus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            qtyInput.value = val + 1;
        });

        // 新增紀錄
        btnAdd.addEventListener('click', async () => {
            const date = dateInput.value;
            const qty = parseInt(qtyInput.value) || 1;

            if (!date) {
                alert('請選擇日期');
                return;
            }
            if (selectedCategories.length === 0) {
                alert('請至少選擇一個項目！');
                return;
            }

            const categoryString = selectedCategories.join('、');
            const newRecord = {
                id: Date.now(),
                date: date,
                category: categoryString,
                quantity: qty,
                synced: false
            };

            // 嘗試發送至 Google Sheets
            const sheetUrl = sheetUrlInput.value.trim();
            if (sheetUrl) {
                btnAdd.disabled = true;
                btnAdd.innerText = '同步中...';
                try {
                    await fetch(sheetUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            date: newRecord.date,
                            category: newRecord.category,
                            quantity: newRecord.quantity
                        })
                    });
                    newRecord.synced = true;
                } catch (e) {
                    console.error('Google Sheet 同步失敗:', e);
                }
                btnAdd.disabled = false;
                btnAdd.innerText = '新增並同步紀錄';
            }

            records.unshift(newRecord);
            saveAndRender();

            // 重置欄位
            qtyInput.value = 1;
            selectedCategories = [];
            catButtons.forEach(b => b.classList.remove('active'));
        });

        // 刪除紀錄
        function deleteRecord(id) {
            records = records.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('shipment_records', JSON.stringify(records));
            renderList();
        }

        function renderList() {
            recordList.innerHTML = '';

            if (records.length === 0) {
                recordList.innerHTML = '<div class="empty-state">目前尚無紀錄</div>';
                return;
            }

            records.forEach(item => {
                const li = document.createElement('li');
                li.className = 'record-item';
                
                const tagsHtml = item.category.split('、').map(c => `<span class="tag-chip">${c}</span>`).join('');
                const syncBadge = item.synced 
                    ? `<span class="status-badge status-success">已同步試算表</span>`
                    : (sheetUrlInput.value ? `<span class="status-badge status-fail">未同步</span>` : '');

                li.innerHTML = `
                    <div class="record-info">
                        <div class="record-tags">${tagsHtml}</div>
                        <span class="record-date">${item.date} ${syncBadge}</span>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="record-qty">${item.quantity} 個</span>
                        <button class="btn-delete" onclick="deleteRecord(${item.id})">刪除</button>
                    </div>
                `;
                recordList.appendChild(li);
            });
        }

        // 匯出 CSV
        btnExport.addEventListener('click', () => {
            if (records.length === 0) {
                alert('目前沒有資料可供匯出！');
                return;
            }

            let csvContent = "\uFEFF日期,項目,數量\n";
            records.forEach(r => {
                csvContent += `${r.date},"${r.category}",${r.quantity}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `耗材與寄件紀錄_${getTodayString()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        renderList();
    </script>
</body>
</html>
