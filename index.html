<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>耗材與寄件紀錄器</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="date"], input[type="url"] {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
        }

        /* 項目單選按鈕網格 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cat-btn {
            height: 48px;
            border: 2px solid var(--border-color);
            background-color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cat-btn.active {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        /* 數量選擇與加減號 */
        .counter-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            width: 52px;
            height: 48px;
            border: none;
            background-color: #e5e7eb;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn-qty:active {
            background-color: #d1d5db;
        }

        .input-qty {
            flex: 1;
            height: 48px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }

        /* 按鈕樣式 */
        .btn-add-item {
            width: 100%;
            height: 46px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit-all {
            width: 100%;
            height: 52px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-submit-all:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        /* 暫存清單區塊 */
        .pending-list {
            list-style: none;
            margin-top: 8px;
        }

        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .pending-tag {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .pending-qty {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.05rem;
        }

        .btn-del-single {
            background-color: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* 歷史紀錄清單 */
        .record-list {
            list-style: none;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .tag-chip {
            background-color: #eff6ff;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .record-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 16px 0;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 耗材與寄件紀錄器</h1>
    </header>

    <!-- API 網址設定區塊 -->
    <div class="card">
        <div class="form-group">
            <label for="sheet-url">Google Sheets Web App 網址</label>
            <input type="url" id="sheet-url" placeholder="貼上 Web App 網址 (https://script.google.com/...)">
        </div>
    </div>

    <!-- 項目與數量新增區塊 -->
    <div class="card">
        <div class="form-group">
            <label for="record-date">選擇日期</label>
            <input type="date" id="record-date">
        </div>

        <div class="form-group">
            <label>1. 選擇項目</label>
            <div class="category-grid">
                <button type="button" class="cat-btn active" data-cat="箱子">箱子</button>
                <button type="button" class="cat-btn" data-cat="袋子">袋子</button>
                <button type="button" class="cat-btn" data-cat="郵局">郵局</button>
                <button type="button" class="cat-btn" data-cat="711運費">711運費</button>
                <button type="button" class="cat-btn" data-cat="郵局運費">郵局運費</button>
            </div>
        </div>

        <div class="form-group">
            <label for="record-qty">2. 設定數量 / 金額</label>
            <div class="counter-container">
                <button type="button" class="btn-qty" id="btn-minus">-</button>
                <input type="number" id="record-qty" class="input-qty" value="1" min="1">
                <button type="button" class="btn-qty" id="btn-plus">+</button>
            </div>
        </div>

        <button type="button" class="btn-add-item" id="btn-add-item">＋ 加入當前紀錄清單</button>
    </div>

    <!-- 待送出紀錄清單（暫存區） -->
    <div class="card">
        <label style="margin-bottom: 8px;">🛒 當前準備寫入清單</label>
        <ul class="pending-list" id="pending-list">
            <!-- 動態加入項目 -->
        </ul>
        <button type="button" class="btn-submit-all" id="btn-submit-all" disabled>送出並寫入 Google 試算表</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="card">
        <label style="margin-bottom: 12px;">📜 本地歷史紀錄</label>
        <ul class="record-list" id="record-list"></ul>
    </div>

    <script>
        const dateInput = document.getElementById('record-date');
        const sheetUrlInput = document.getElementById('sheet-url');
        const catButtons = document.querySelectorAll('.cat-btn');
        const qtyInput = document.getElementById('record-qty');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const btnAddItem = document.getElementById('btn-add-item');
        const btnSubmitAll = document.getElementById('btn-submit-all');
        const pendingList = document.getElementById('pending-list');
        const recordList = document.getElementById('record-list');

        let selectedCategory = '箱子';
        let pendingItems = [];
        let historyRecords = JSON.parse(localStorage.getItem('shipment_records_v2')) || [];

        // 初始化日期與網址
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        dateInput.value = getTodayString();
        sheetUrlInput.value = localStorage.getItem('google_sheet_url') || '';

        sheetUrlInput.addEventListener('change', () => {
            localStorage.setItem('google_sheet_url', sheetUrlInput.value.trim());
        });

        // 選擇單一項目
        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                catButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.cat;
            });
        });

        // 數量調整
        btnMinus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            if (val > 1) qtyInput.value = val - 1;
        });

        btnPlus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            qtyInput.value = val + 1;
        });

        // 加入暫存清單（一個一個加）
        btnAddItem.addEventListener('click', () => {
            const qty = parseInt(qtyInput.value) || 1;
            
            // 檢查是否已在暫存中，若有則直接累加數量
            const existingIndex = pendingItems.findIndex(item => item.category === selectedCategory);
            if (existingIndex > -1) {
                pendingItems[existingIndex].quantity += qty;
            } else {
                pendingItems.push({
                    id: Date.now(),
                    category: selectedCategory,
                    quantity: qty
                });
            }

            qtyInput.value = 1;
            renderPendingList();
        });

        // 刪除暫存項目
        function deletePendingItem(id) {
            pendingItems = pendingItems.filter(item => item.id !== id);
            renderPendingList();
        }

        // 渲染暫存清單
        function renderPendingList() {
            pendingList.innerHTML = '';

            if (pendingItems.length === 0) {
                pendingList.innerHTML = '<div class="empty-state">尚未加入任何項目，請點擊上方按鈕新增</div>';
                btnSubmitAll.disabled = true;
                return;
            }

            btnSubmitAll.disabled = false;
            pendingItems.forEach(item => {
                const li = document.createElement('li');
                li.className = 'pending-item';
                li.innerHTML = `
                    <div>
                        <span class="pending-tag">${item.category}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap: 10px;">
                        <span class="pending-qty">+${item.quantity}</span>
                        <button class="btn-del-single" onclick="deletePendingItem(${item.id})">移除</button>
                    </div>
                `;
                pendingList.appendChild(li);
            });
        }

        // 送出並寫入 Google 試算表
        btnSubmitAll.addEventListener('click', async () => {
            const date = dateInput.value;
            if (!date) return alert('請選擇日期');
            if (pendingItems.length === 0) return alert('清單內沒有項目');

            const sheetUrl = sheetUrlInput.value.trim();
            if (!sheetUrl) return alert('請先填入 Google Sheets Web App 網址！');

            btnSubmitAll.disabled = true;
            btnSubmitAll.innerText = '正在寫入 Google 試算表...';

            const payload = {
                date: date,
                items: pendingItems
            };

            try {
                await fetch(sheetUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // 儲存至本地歷史紀錄
                historyRecords.unshift({
                    id: Date.now(),
                    date: date,
                    items: [...pendingItems]
                });
                localStorage.setItem('shipment_records_v2', JSON.stringify(historyRecords));
                renderHistoryList();

                // 清空暫存
                pendingItems = [];
                renderPendingList();
                alert('✅ 已成功寫入 Google 試算表！');
            } catch (e) {
                console.error('寫入失敗:', e);
                alert('❌ 寫入失敗，請檢查網路或 API 網址設定');
            }

            btnSubmitAll.disabled = false;
            btnSubmitAll.innerText = '送出並寫入 Google 試算表';
        });

        // 渲染歷史紀錄
        function renderHistoryList() {
            recordList.innerHTML = '';
            if (historyRecords.length === 0) {
                recordList.innerHTML = '<div class="empty-state">目前尚無歷史紀錄</div>';
                return;
            }

            historyRecords.forEach(item => {
                const li = document.createElement('li');
                li.className = 'record-item';
                const tagsHtml = item.items.map(i => `<span class="tag-chip">${i.category} × ${i.quantity}</span>`).join('');
                li.innerHTML = `
                    <div>
                        <div>${tagsHtml}</div>
                        <div class="record-date">${item.date}</div>
                    </div>
                `;
                recordList.appendChild(li);
            });
        }

        // 初始化
        renderPendingList();
        renderHistoryList();
    </script>
</body>
</html>
