<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小幫手寄件與運費紀錄器</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 40px 16px;
            max-width: 520px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="date"], input[type="number"] {
            width: 100%;
            height: 44px;
            padding: 0 10px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 第一列：箱子、袋子、郵局 三等分卡片 */
        .pack-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .pack-item {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
        }

        .pack-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* 數量計數器微調 */
        .qty-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-mini {
            width: 32px;
            height: 36px;
            border: 1px solid var(--border-color);
            background-color: #fff;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .btn-mini:active {
            background-color: var(--border-color);
        }

        .input-mini {
            width: 42px !important;
            height: 36px !important;
            text-align: center;
            font-weight: 700;
            padding: 0 !important;
        }

        /* 郵局運費專用網格 */
        .post-freight-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 按鈕樣式 */
        .btn-add {
            width: 100%;
            height: 44px;
            background-color: var(--primary-light);
            color: var(--primary);
            border: 1.5px solid var(--primary);
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add:hover {
            background-color: var(--primary);
            color: white;
        }

        .btn-success {
            width: 100%;
            height: 52px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            margin-top: 12px;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .btn-success:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* 待寫入清單與操作按鈕 */
        .pending-list {
            list-style: none;
        }

        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .pending-tag {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .pending-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .pending-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-edit {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-edit:hover {
            background-color: var(--primary-light);
        }

        .btn-del {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-del:hover {
            background-color: #fef2f2;
        }

        /* 歷史紀錄 */
        .record-list {
            list-style: none;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .tag-chip {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-block;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .record-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 小幫手寄件與運費紀錄器</h1>
    </header>

    <!-- 日期選擇卡片 -->
    <div class="card">
        <div class="form-group">
            <label for="record-date">紀錄日期</label>
            <input type="date" id="record-date">
        </div>
    </div>

    <!-- 區塊 1：包貨耗材數量紀錄 (箱子 / 袋子 / 郵局) -->
    <div class="card">
        <div class="card-title">
            <span>📦 包貨耗材數量</span>
        </div>
        <div class="pack-grid">
            <!-- 箱子 -->
            <div class="pack-item">
                <div class="pack-title">箱子</div>
                <div class="qty-control">
                    <button type="button" class="btn-mini" onclick="adjustQty('box', -1)">-</button>
                    <input type="number" id="qty-box" class="input-mini" value="0" min="0">
                    <button type="button" class="btn-mini" onclick="adjustQty('box', 1)">+</button>
                </div>
            </div>
            <!-- 袋子 -->
            <div class="pack-item">
                <div class="pack-title">袋子</div>
                <div class="qty-control">
                    <button type="button" class="btn-mini" onclick="adjustQty('bag', -1)">-</button>
                    <input type="number" id="qty-bag" class="input-mini" value="0" min="0">
                    <button type="button" class="btn-mini" onclick="adjustQty('bag', 1)">+</button>
                </div>
            </div>
            <!-- 郵局 -->
            <div class="pack-item">
                <div class="pack-title">郵局</div>
                <div class="qty-control">
                    <button type="button" class="btn-mini" onclick="adjustQty('post', -1)">-</button>
                    <input type="number" id="qty-post" class="input-mini" value="0" min="0">
                    <button type="button" class="btn-mini" onclick="adjustQty('post', 1)">+</button>
                </div>
            </div>
        </div>
        <button type="button" class="btn-add" id="btn-add-materials">＋ 加入耗材數量至清單</button>
    </div>

    <!-- 區塊 2：郵局運費獨立紀錄 (金額 + 數量) -->
    <div class="card">
        <div class="card-title">
            <span>📮 郵局運費紀錄 (獨立計算)</span>
        </div>
        <div class="post-freight-grid form-group">
            <div>
                <label for="post-price">運費金額 (NT$)</label>
                <input type="number" id="post-price" placeholder="例如: 80" min="0">
            </div>
            <div>
                <label for="post-qty">筆數 / 數量</label>
                <div class="qty-control">
                    <button type="button" class="btn-mini" onclick="adjustPostFreightQty(-1)">-</button>
                    <input type="number" id="post-freight-qty" class="input-mini" value="1" min="1">
                    <button type="button" class="btn-mini" onclick="adjustPostFreightQty(1)">+</button>
                </div>
            </div>
        </div>
        <button type="button" class="btn-add" id="btn-add-post-freight">＋ 新增一筆郵局運費</button>
    </div>

    <!-- 區塊 3：待寫入清單 (支援動態編輯與刪除) -->
    <div class="card">
        <div class="card-title">
            <span>🛒 待寫入清單</span>
            <button class="btn-secondary" id="btn-clear-pending" style="display: none;">清空</button>
        </div>
        <ul class="pending-list" id="pending-list"></ul>
        <button type="button" class="btn-success" id="btn-submit-all" disabled>送出並寫入 Google 試算表</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="card">
        <div class="card-title">
            <span>📜 本地歷史紀錄</span>
        </div>
        <ul class="record-list" id="record-list"></ul>
    </div>

    <script>
        // 固定的 API 網址
        const FIXED_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcyOqjb8zNUzUuigIuYZVDeq8X3n3lrm8SnZTQUWvqz0MxKRfhf4jTEkY61VNij7a9/exec';

        const dateInput = document.getElementById('record-date');
        const qtyBox = document.getElementById('qty-box');
        const qtyBag = document.getElementById('qty-bag');
        const qtyPost = document.getElementById('qty-post');
        const postPriceInput = document.getElementById('post-price');
        const postFreightQtyInput = document.getElementById('post-freight-qty');
        
        const btnAddMaterials = document.getElementById('btn-add-materials');
        const btnAddPostFreight = document.getElementById('btn-add-post-freight');
        const btnSubmitAll = document.getElementById('btn-submit-all');
        const btnClearPending = document.getElementById('btn-clear-pending');
        const pendingList = document.getElementById('pending-list');
        const recordList = document.getElementById('record-list');

        let pendingItems = [];
        let historyRecords = JSON.parse(localStorage.getItem('shipment_records_v5')) || [];

        // 初始化日期為今天
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        dateInput.value = getTodayString();

        // 耗材微調控制
        function adjustQty(type, delta) {
            let el = type === 'box' ? qtyBox : (type === 'bag' ? qtyBag : qtyPost);
            let val = parseInt(el.value) || 0;
            val = Math.max(0, val + delta);
            el.value = val;
        }

        // 郵局運費筆數微調
        function adjustPostFreightQty(delta) {
            let val = parseInt(postFreightQtyInput.value) || 1;
            val = Math.max(1, val + delta);
            postFreightQtyInput.value = val;
        }

        // 加入耗材數量至清單
        btnAddMaterials.addEventListener('click', () => {
            const box = parseInt(qtyBox.value) || 0;
            const bag = parseInt(qtyBag.value) || 0;
            const post = parseInt(qtyPost.value) || 0;

            if (box === 0 && bag === 0 && post === 0) {
                return alert('請至少填寫一個耗材的數量');
            }

            const itemsToAdd = [
                { category: '箱子', qty: box },
                { category: '袋子', qty: bag },
                { category: '郵局', qty: post }
            ];

            itemsToAdd.forEach(item => {
                if (item.qty > 0) {
                    const existing = pendingItems.find(p => p.category === item.category && p.type === 'material');
                    if (existing) {
                        existing.quantity += item.qty;
                    } else {
                        pendingItems.push({
                            id: Date.now() + Math.random(),
                            type: 'material',
                            category: item.category,
                            quantity: item.qty
                        });
                    }
                }
            });

            // 清空數量框
            qtyBox.value = 0;
            qtyBag.value = 0;
            qtyPost.value = 0;

            renderPendingList();
        });

        // 新增獨立的一筆郵局運費 (不合併計算)
        btnAddPostFreight.addEventListener('click', () => {
            const price = parseFloat(postPriceInput.value) || 0;
            const qty = parseInt(postFreightQtyInput.value) || 1;

            if (price <= 0) {
                return alert('請輸入有效的郵局運費金額');
            }

            // 每次直接 push 新紀錄，不加總合併
            pendingItems.push({
                id: Date.now() + Math.random(),
                type: 'post_freight',
                category: '郵局運費',
                amount: price,
                quantity: qty
            });

            postPriceInput.value = '';
            postFreightQtyInput.value = 1;

            renderPendingList();
        });

        // 編輯待寫入項目
        function editPendingItem(id) {
            const item = pendingItems.find(p => p.id === id);
            if (!item) return;

            if (item.type === 'material') {
                const newQty = prompt(`請輸入新的【${item.category}】數量:`, item.quantity);
                if (newQty !== null && !isNaN(newQty) && parseInt(newQty) > 0) {
                    item.quantity = parseInt(newQty);
                }
            } else if (item.type === 'post_freight') {
                const newAmount = prompt(`請輸入新的【郵局運費金額】:`, item.amount);
                const newQty = prompt(`請輸入新的【筆數/數量】:`, item.quantity);
                if (newAmount !== null && !isNaN(newAmount) && parseFloat(newAmount) > 0) {
                    item.amount = parseFloat(newAmount);
                }
                if (newQty !== null && !isNaN(newQty) && parseInt(newQty) > 0) {
                    item.quantity = parseInt(newQty);
                }
            }
            renderPendingList();
        }

        // 刪除待寫入項目
        function deletePendingItem(id) {
            pendingItems = pendingItems.filter(item => item.id !== id);
            renderPendingList();
        }

        // 清空所有待寫入項目
        btnClearPending.addEventListener('click', () => {
            pendingItems = [];
            renderPendingList();
        });

        // 渲染待寫入清單
        function renderPendingList() {
            pendingList.innerHTML = '';

            if (pendingItems.length === 0) {
                pendingList.innerHTML = '<div class="empty-state">目前清單為空，請輸入後點擊新增</div>';
                btnSubmitAll.disabled = true;
                btnClearPending.style.display = 'none';
                return;
            }

            btnSubmitAll.disabled = false;
            btnClearPending.style.display = 'inline-block';

            pendingItems.forEach(item => {
                const li = document.createElement('li');
                li.className = 'pending-item';

                let titleText = item.category;
                let subText = '';

                if (item.type === 'material') {
                    subText = `數量: ${item.quantity}`;
                } else if (item.type === 'post_freight') {
                    const totalCost = item.amount * item.quantity;
                    subText = `金額: $${item.amount} × ${item.quantity} 筆 (共 $${totalCost})`;
                }

                li.innerHTML = `
                    <div>
                        <div class="pending-tag">${titleText}</div>
                        <div class="pending-sub">${subText}</div>
                    </div>
                    <div class="pending-actions">
                        <button class="btn-edit" onclick="editPendingItem(${item.id})">✏️ 編輯</button>
                        <button class="btn-del" onclick="deletePendingItem(${item.id})">刪除</button>
                    </div>
                `;
                pendingList.appendChild(li);
            });
        }

        // 送出至 Google 試算表
        btnSubmitAll.addEventListener('click', async () => {
            const date = dateInput.value;
            if (!date) return alert('請選擇日期');
            if (pendingItems.length === 0) return alert('清單內沒有項目');

            btnSubmitAll.disabled = true;
            btnSubmitAll.innerText = '正在寫入 Google 試算表...';

            // 將獨立的郵局運費資料轉換成試算表格式
            const formattedItems = pendingItems.map(item => {
                if (item.type === 'post_freight') {
                    return {
                        category: '郵局運費',
                        quantity: item.amount * item.quantity // 傳送總金額給 Google Sheet 進行當日累加
                    };
                }
                return {
                    category: item.category,
                    quantity: item.quantity
                };
            });

            const payload = {
                date: date,
                items: formattedItems
            };

            try {
                await fetch(FIXED_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // 儲存至本地歷史紀錄
                historyRecords.unshift({
                    id: Date.now(),
                    date: date,
                    items: [...pendingItems]
                });
                localStorage.setItem('shipment_records_v5', JSON.stringify(historyRecords));
                renderHistoryList();

                // 清空暫存
                pendingItems = [];
                renderPendingList();
                alert('✅ 已成功寫入 Google 試算表！');
            } catch (e) {
                console.error('寫入失敗:', e);
                alert('❌ 寫入失敗，請確認網路連線');
            }

            btnSubmitAll.disabled = false;
            btnSubmitAll.innerText = '送出並寫入 Google 試算表';
        });

        // 渲染歷史紀錄
        function renderHistoryList() {
            recordList.innerHTML = '';
            if (historyRecords.length === 0) {
                recordList.innerHTML = '<div class="empty-state">目前尚無歷史紀錄</div>';
                return;
            }

            historyRecords.forEach(item => {
                const li = document.createElement('li');
                li.className = 'record-item';
                const tagsHtml = item.items.map(i => {
                    const label = i.type === 'post_freight' 
                        ? `郵局運費 $${i.amount}×${i.quantity}` 
                        : `${i.category} × ${i.quantity}`;
                    return `<span class="tag-chip">${label}</span>`;
                }).join('');

                li.innerHTML = `
                    <div>
                        <div>${tagsHtml}</div>
                        <div class="record-date">${item.date}</div>
                    </div>
                `;
                recordList.appendChild(li);
            });
        }

        // 初始化
        renderPendingList();
        renderHistoryList();
    </script>
</body>
</html>
