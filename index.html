<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寄件與運費紀錄器</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 40px 16px;
            max-width: 520px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="date"], input[type="number"] {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 寄送方式選擇器 (7-11 vs 郵局) */
        .shipping-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .ship-btn {
            height: 50px;
            border: 2px solid var(--border-color);
            background-color: #fff;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ship-btn.active {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
        }

        /* 寄件項目按鈕網格 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .cat-btn {
            height: 46px;
            border: 1.5px solid var(--border-color);
            background-color: #fff;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cat-btn:hover {
            border-color: var(--primary);
        }

        .cat-btn.active {
            border-color: var(--primary);
            background-color: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        /* 數量微調按鈕 */
        .counter-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            width: 48px;
            height: 48px;
            border: 1.5px solid var(--border-color);
            background-color: #f8fafc;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-main);
            transition: background-color 0.15s;
        }

        .btn-qty:hover {
            background-color: #e2e8f0;
        }

        .btn-qty:active {
            transform: scale(0.96);
        }

        .input-qty {
            text-align: center;
            font-weight: 700;
            flex: 1;
        }

        /* 按鈕樣式設計 */
        .btn-main {
            width: 100%;
            height: 50px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        .btn-main:active {
            transform: scale(0.99);
        }

        .btn-success {
            width: 100%;
            height: 52px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            margin-top: 12px;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .btn-success:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        /* 暫存清單 */
        .pending-list {
            list-style: none;
        }

        .pending-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .pending-tag {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .pending-qty {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .btn-del-single {
            background-color: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-del-single:hover {
            background-color: #fef2f2;
        }

        /* 歷史紀錄 */
        .record-list {
            list-style: none;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .tag-chip {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-block;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .record-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 小幫手寄件與運費紀錄器</h1>
    </header>

    <!-- 主操作卡片 -->
    <div class="card">
        <div class="form-group">
            <label for="record-date">選擇日期</label>
            <input type="date" id="record-date">
        </div>

        <!-- 寄送方式選擇 (7-11 vs 郵局) -->
        <div class="form-group">
            <label>寄送方式</label>
            <div class="shipping-grid">
                <button type="button" class="ship-btn active" data-mode="711">🏪 7-11</button>
                <button type="button" class="ship-btn" data-mode="post">📮 郵局</button>
            </div>
        </div>

        <!-- 只有點選郵局時才會顯示運費輸入框 -->
        <div class="form-group" id="freight-group" style="display: none;">
            <label for="freight-amount">郵局運費金額 (NT$)</label>
            <input type="number" id="freight-amount" placeholder="請輸入郵局運費金額" min="0">
        </div>

        <!-- 寄件項目選擇 -->
        <div class="form-group">
            <label>選擇寄件項目</label>
            <div class="category-grid">
                <button type="button" class="cat-btn active" data-cat="箱子">箱子</button>
                <button type="button" class="cat-btn" data-cat="袋子">袋子</button>
                <button type="button" class="cat-btn" data-cat="郵局">郵局</button>
            </div>
        </div>

        <!-- 僅保留數量選擇 -->
        <div class="form-group">
            <label for="record-qty">數量</label>
            <div class="counter-container">
                <button type="button" class="btn-qty" id="btn-minus">-</button>
                <input type="number" id="record-qty" class="input-qty" value="1" min="1">
                <button type="button" class="btn-qty" id="btn-plus">+</button>
            </div>
        </div>

        <button type="button" class="btn-main" id="btn-add-item">＋ 加入當前紀錄清單</button>
    </div>

    <!-- 待寫入清單 -->
    <div class="card">
        <div class="card-title">
            <span>🛒 待寫入清單</span>
            <button class="btn-secondary" id="btn-clear-pending" style="display: none;">清空</button>
        </div>
        <ul class="pending-list" id="pending-list"></ul>
        <button type="button" class="btn-success" id="btn-submit-all" disabled>送出並寫入 Google 試算表</button>
    </div>

    <!-- 歷史紀錄 -->
    <div class="card">
        <div class="card-title">
            <span>📜 本地歷史紀錄</span>
        </div>
        <ul class="record-list" id="record-list"></ul>
    </div>

    <script>
        // 固定的 API 網址
        const FIXED_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcyOqjb8zNUzUuigIuYZVDeq8X3n3lrm8SnZTQUWvqz0MxKRfhf4jTEkY61VNij7a9/exec';

        const dateInput = document.getElementById('record-date');
        const shipButtons = document.querySelectorAll('.ship-btn');
        const freightGroup = document.getElementById('freight-group');
        const freightAmountInput = document.getElementById('freight-amount');
        const catButtons = document.querySelectorAll('.cat-btn');
        const qtyInput = document.getElementById('record-qty');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        const btnAddItem = document.getElementById('btn-add-item');
        const btnSubmitAll = document.getElementById('btn-submit-all');
        const btnClearPending = document.getElementById('btn-clear-pending');
        const pendingList = document.getElementById('pending-list');
        const recordList = document.getElementById('record-list');

        let shippingMode = '711'; // '711' or 'post'
        let selectedCategory = '箱子';
        let pendingItems = [];
        let historyRecords = JSON.parse(localStorage.getItem('shipment_records_v4')) || [];

        // 初始化日期為今天
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        dateInput.value = getTodayString();

        // 寄送模式切換 (7-11 vs 郵局)
        shipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                shipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                shippingMode = btn.dataset.mode;

                if (shippingMode === '711') {
                    freightGroup.style.display = 'none';
                    freightAmountInput.value = '';
                } else {
                    freightGroup.style.display = 'block';
                    freightAmountInput.focus();
                }
            });
        });

        // 選擇寄件項目
        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                catButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.cat;
            });
        });

        // 數量加減
        btnMinus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            if (val > 1) qtyInput.value = val - 1;
        });

        btnPlus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value) || 1;
            qtyInput.value = val + 1;
        });

        // 加入暫存清單
        btnAddItem.addEventListener('click', () => {
            const qty = parseInt(qtyInput.value) || 1;

            // 檢查是否已有相同項目，有則累加
            const existingIndex = pendingItems.findIndex(item => item.category === selectedCategory && item.type === 'item');
            if (existingIndex > -1) {
                pendingItems[existingIndex].quantity += qty;
            } else {
                pendingItems.push({
                    id: Date.now(),
                    type: 'item',
                    category: selectedCategory,
                    quantity: qty
                });
            }

            // 若選擇郵局且輸入了郵局運費，併入運費紀錄
            if (shippingMode === 'post') {
                const freightPrice = parseFloat(freightAmountInput.value) || 0;
                if (freightPrice > 0) {
                    const existingFreight = pendingItems.findIndex(item => item.category === '郵局運費');
                    if (existingFreight > -1) {
                        pendingItems[existingFreight].quantity += freightPrice;
                    } else {
                        pendingItems.push({
                            id: Date.now() + 1,
                            type: 'freight',
                            category: '郵局運費',
                            quantity: freightPrice
                        });
                    }
                    freightAmountInput.value = ''; // 清空運費輸入框
                }
            } else if (shippingMode === '711') {
                // 7-11 預設 711運費 為 0
                const existing711 = pendingItems.findIndex(item => item.category === '711運費');
                if (existing711 === -1) {
                    pendingItems.push({
                        id: Date.now() + 2,
                        type: 'freight',
                        category: '711運費',
                        quantity: 0
                    });
                }
            }

            qtyInput.value = 1;
            renderPendingList();
        });

        // 刪除個別暫存項目
        function deletePendingItem(id) {
            pendingItems = pendingItems.filter(item => item.id !== id);
            renderPendingList();
        }

        // 清空暫存
        btnClearPending.addEventListener('click', () => {
            pendingItems = [];
            renderPendingList();
        });

        // 渲染暫存清單
        function renderPendingList() {
            pendingList.innerHTML = '';

            if (pendingItems.length === 0) {
                pendingList.innerHTML = '<div class="empty-state">尚未加入任何項目，請選擇後點擊「加入清單」</div>';
                btnSubmitAll.disabled = true;
                btnClearPending.style.display = 'none';
                return;
            }

            btnSubmitAll.disabled = false;
            btnClearPending.style.display = 'inline-block';

            pendingItems.forEach(item => {
                const li = document.createElement('li');
                li.className = 'pending-item';
                
                const isFreight = item.type === 'freight';
                const qtyDisplay = isFreight ? `$${item.quantity}` : `數量: ${item.quantity}`;

                li.innerHTML = `
                    <div>
                        <div class="pending-tag">${item.category}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap: 12px;">
                        <span class="pending-qty">${qtyDisplay}</span>
                        <button class="btn-del-single" onclick="deletePendingItem(${item.id})">移除</button>
                    </div>
                `;
                pendingList.appendChild(li);
            });
        }

        // 送出至 Google 試算表
        btnSubmitAll.addEventListener('click', async () => {
            const date = dateInput.value;
            if (!date) return alert('請選擇日期');
            if (pendingItems.length === 0) return alert('清單內沒有項目');

            btnSubmitAll.disabled = true;
            btnSubmitAll.innerText = '正在寫入 Google 試算表...';

            const payload = {
                date: date,
                items: pendingItems
            };

            try {
                await fetch(FIXED_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // 儲存至本地歷史紀錄
                historyRecords.unshift({
                    id: Date.now(),
                    date: date,
                    items: [...pendingItems]
                });
                localStorage.setItem('shipment_records_v4', JSON.stringify(historyRecords));
                renderHistoryList();

                // 清空暫存
                pendingItems = [];
                renderPendingList();
                alert('✅ 已成功寫入 Google 試算表！');
            } catch (e) {
                console.error('寫入失敗:', e);
                alert('❌ 寫入失敗，請確認網路連線');
            }

            btnSubmitAll.disabled = false;
            btnSubmitAll.innerText = '送出並寫入 Google 試算表';
        });

        // 渲染歷史紀錄
        function renderHistoryList() {
            recordList.innerHTML = '';
            if (historyRecords.length === 0) {
                recordList.innerHTML = '<div class="empty-state">目前尚無歷史紀錄</div>';
                return;
            }

            historyRecords.forEach(item => {
                const li = document.createElement('li');
                li.className = 'record-item';
                const tagsHtml = item.items.map(i => {
                    const label = i.type === 'freight' ? `${i.category} $${i.quantity}` : `${i.category} × ${i.quantity}`;
                    return `<span class="tag-chip">${label}</span>`;
                }).join('');

                li.innerHTML = `
                    <div>
                        <div>${tagsHtml}</div>
                        <div class="record-date">${item.date}</div>
                    </div>
                `;
                recordList.appendChild(li);
            });
        }

        // 初始化
        renderPendingList();
        renderHistoryList();
    </script>
</body>
</html>
